name: board
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mpsf-board
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge scores into GitHub
        env:
          MPSF_LIVE: https://crudcrud.com/api/6bf92a3a1f284c42bf03d2018fa2c01e/scores
        run: python3 .github/sync_board.py
      - name: Commit archive
        run: |
          git config user.name "mpsf-board"
          git config user.email "201271599+maqsudjon-cell@users.noreply.github.com"
          git add board.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Sync hop scores"
            git push
          fi
